[build]
command = "npm run build"

[build.environment]
NODE_VERSION = "20"
INVESTPILOT_APP_VERSION = "0.2.0"
INVESTPILOT_RELEASE_CHANNEL = "public-beta"

[[headers]]
for = "/_next/static/*"

[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/*"

[headers.values]
X-Frame-Options = "DENY"
X-Content-Type-Options = "nosniff"
Referrer-Policy = "strict-origin-when-cross-origin"
